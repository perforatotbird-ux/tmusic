services:
  # Optional PostgreSQL for local/compose deploys.
  # Provision the local secret: python scripts/init_db_secret.py
  # Enable: docker compose --profile db up -d
  # Set DATABASE_URL in the ignored music.env; see Obsidian PostgreSQL runbook.
  db:
    image: postgres:16-alpine
    container_name: tmusic-postgres
    profiles: ["db"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: tgmusic
      POSTGRES_USER: tmusic
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    ports:
      - "127.0.0.1:5432:5432"
    secrets:
      - postgres_password
    volumes:
      - tmusic_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tmusic -d tgmusic"]
      interval: 5s
      timeout: 3s
      retries: 10

  tmusic-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tmusic-server
    restart: unless-stopped
    ports:
      - "8005:8005"
      - "8211:8211/udp"
    volumes:
      - ./music.env:/app/music.env:ro
      - ./cache:/app/cache
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # SECURITY (2026-09 audit): restrict container privilege escalation and
    # drop capabilities the server does not need.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: false  # cache/ and data/ are writable volumes; keep image mutable for simplicity

volumes:
  tmusic_pgdata:

# Local file is excluded from Git and the image build context.
# Mounted only in db; the application receives its own DATABASE_URL.
secrets:
  postgres_password:
    file: ./.secrets/postgres_password
