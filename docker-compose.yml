version: '3.8'

services:
  # Optional PostgreSQL for local/compose deploys.
  # Enable: docker compose --profile db up -d
  # Point DATABASE_URL at: postgresql://tmusic:tmusic@db:5432/tgmusic
  db:
    image: postgres:16-alpine
    container_name: tmusic-postgres
    profiles: ["db"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: tgmusic
      POSTGRES_USER: tmusic
      POSTGRES_PASSWORD: tmusic
    ports:
      - "5432:5432"
    volumes:
      - tmusic_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tmusic -d tgmusic"]
      interval: 5s
      timeout: 3s
      retries: 10

  tmusic-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tmusic-server
    restart: unless-stopped
    ports:
      - "8005:8005"
    volumes:
      - ./music.env:/app/music.env
      - ./cache:/app/cache
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # SECURITY (2026-09 audit): restrict container privilege escalation and
    # drop capabilities the server does not need.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: false  # cache/ and data/ are writable volumes; keep image mutable for simplicity

volumes:
  tmusic_pgdata:
