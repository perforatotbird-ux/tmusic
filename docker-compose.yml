version: '3.8'

services:
  tmusic-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tmusic-server
    restart: unless-stopped
    ports:
      - "8005:8005"
    volumes:
      - ./music.env:/app/music.env
      - ./cache:/app/cache
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # SECURITY (2026-09 audit): restrict container privilege escalation and
    # drop capabilities the server does not need.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: false  # cache/ and data/ are writable volumes; keep image mutable for simplicity
